<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a6e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Game</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="touch">
    <div class="tbtn" id="t-left">◀</div>
    <div class="tbtn" id="t-right">▶</div>
    <div class="tbtn" id="t-run">B</div>
    <div class="tbtn" id="t-jump">▲</div>
    <div class="tbtn" id="t-pause">II</div>
  </div>
  <form id="form" hidden autocomplete="on"><div class="box">
    <h2 id="form-title"></h2>
    <div id="form-fields"></div>
    <p id="form-msg"></p>
    <div class="buttons" id="form-buttons"></div>
  </div></form>
  <div id="rotate"><div class="phone"></div><div id="rotate-text">Please rotate your device</div></div>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/art.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/replay.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/online.js"></script>
  <script src="js/community.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
